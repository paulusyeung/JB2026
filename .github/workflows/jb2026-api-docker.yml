name: Build and Publish JB2026.Api Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "JB2026.Api/**"
      - "JB2026.Infrastructure/**"
      - "JB2026.EfCore/**"
      - "JB2026.DataAccess/**"
      - "JB2026.sln"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/jb2026-api-docker.yml"
      - "README.md"
  pull_request:
    paths:
      - "JB2026.Api/**"
      - "JB2026.Infrastructure/**"
      - "JB2026.EfCore/**"
      - "JB2026.DataAccess/**"
      - "JB2026.sln"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/jb2026-api-docker.yml"
      - "README.md"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push JB2026.Api to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Normalize the image path to lowercase for GHCR compatibility.
      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/jb2026-api" \
            >> "$GITHUB_OUTPUT"

      # Pull requests validate build only and never push to GHCR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.image.outputs.name) || '' }}
