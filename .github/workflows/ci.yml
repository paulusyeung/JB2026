name: JB2026 CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  build_test_lint:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JB2026.sln

      - name: Build
        run: dotnet build JB2026.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test JB2026.sln --configuration Release --no-build --verbosity normal

      - name: Parity Tests (Phase 4)
        run: dotnet test JB2026.Api.ParityTests/JB2026.Api.ParityTests.csproj --configuration Release --no-build --verbosity normal

      - name: Lint
        run: dotnet format JB2026.sln --verify-no-changes --no-restore

  security_scan:
    name: Security Scan Gate
    runs-on: ubuntu-latest
    needs: build_test_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JB2026.sln

      - name: Vulnerability Scan
        shell: pwsh
        run: ./scripts/security-scan.ps1

  license_scan:
    name: License Scan Gate
    runs-on: ubuntu-latest
    needs: build_test_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JB2026.sln

      - name: License Compliance
        shell: pwsh
        run: ./scripts/license-scan.ps1
