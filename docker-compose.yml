# =============================================================================
# JB2026 Docker Compose Stack
# =============================================================================
# Usage:
#   docker compose up -d              # start the full stack
#   docker compose down               # stop and remove containers
#   docker compose pull               # pull latest images from Docker Hub
#   docker compose logs -f backend    # tail backend logs
#
# Required .env variables (create a .env file next to this compose file):
#
#   DOCKER_HUB_USERNAME   Your Docker Hub username (default: youruser)
#   DB_CONNECTION_STRING  SQL Server connection string (REQUIRED)
#   JWT_KEY               JWT signing key, min 32 chars (REQUIRED)
#
# Optional .env variables:
#
#   IMAGE_TAG             Image tag (default: latest)
#   FRONTEND_PORT         Host port for frontend (default: 80)
#   BACKEND_PORT          Host port for backend  (default: 8080)
#   JWT_ISSUER            JWT issuer   (default: jb2026-api)
#   JWT_AUDIENCE          JWT audience (default: jb2026-clients)
#   CORS_ALLOWED_ORIGINS  Comma-separated allowed origins (default: http://localhost)
#   BILLING_BASE_URL      Invoice Ninja / billing endpoint
#   TWENTY_CRM_BASE_URL   Twenty CRM endpoint
#   OLLAMA_BASE_URL       Ollama LLM endpoint (e.g. http://host.docker.internal:11434)
#   PAPERLESS_NGX_BASE_URL  Paperless-ngx endpoint
#   SQL_SA_PASSWORD       SQL Server SA password (only if sql-server service is enabled)
#   SQL_PORT              SQL Server host port (default: 1433)
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Backend — .NET 8 API
  # -------------------------------------------------------------------------
  backend:
    image: ${DOCKER_HUB_USERNAME:-youruser}/jb2026-backend:${IMAGE_TAG:-latest}
    container_name: jb2026-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Primary database connection (required — the API refuses to start without it)
      - ConnectionStrings__Primary=${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
      # JWT configuration (defaults exist in code, override here for production)
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-jb2026-api}
      - Jwt__Audience=${JWT_AUDIENCE:-jb2026-clients}
      # CORS — comma-separated list of allowed origins (the frontend Nginx proxies
      # /api/ so same-origin is typical, but set this if you expose the backend
      # on a different host/port, e.g. for direct API access from a mobile app)
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost}
      # External service endpoints (optional — omit to use in-memory defaults)
      - Billing__BaseUrl=${BILLING_BASE_URL:-}
      - TwentyCrm__BaseUrl=${TWENTY_CRM_BASE_URL:-}
      - Ollama__BaseUrl=${OLLAMA_BASE_URL:-}
      - PaperlessNgx__BaseUrl=${PAPERLESS_NGX_BASE_URL:-}
    depends_on:
      sql-server:
        condition: service_started
        required: false   # if you comment out sql-server, the API falls back to in-memory
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - jb2026

  # -------------------------------------------------------------------------
  # Frontend — Vue 3 SPA served by Nginx
  # -------------------------------------------------------------------------
  frontend:
    image: ${DOCKER_HUB_USERNAME:-youruser}/jb2026-frontend:${IMAGE_TAG:-latest}
    container_name: jb2026-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jb2026

  # -------------------------------------------------------------------------
  # SQL Server — optional; uncomment to run the database in Docker.
  # For production, point DB_CONNECTION_STRING at an external SQL Server
  # and remove this service.
  # -------------------------------------------------------------------------
  # sql-server:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: jb2026-sql
  #   ports:
  #     - "${SQL_PORT:-1433}:1433"
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env for local SQL}
  #     - MSSQL_PID=Developer
  #   volumes:
  #     - mssql-data:/var/opt/mssql
  #   healthcheck:
  #     test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
  #     interval: 15s
  #     timeout: 5s
  #     start_period: 30s
  #     retries: 5
  #   restart: unless-stopped
  #   networks:
  #     - jb2026

volumes:
  mssql-data:
    driver: local

networks:
  jb2026:
    driver: bridge