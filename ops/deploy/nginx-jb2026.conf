server {
    listen 80;
    server_name _;

    # Allow job attachments / file uploads through /api/ (default is 1 MB).
    client_max_body_size 50m;

    root /opt/jb2026/current/web;
    index index.html;

    # Backend listens only on 127.0.0.1:8080; Nginx is the only public entry point.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Serve the Vue SPA at /app/ with client-side routing fallback.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect bare /app (no trailing slash) and root to the SPA entry point.
    location = /app {
        return 301 /app/;
    }
    location = / {
        return 302 /app/;
    }
}
